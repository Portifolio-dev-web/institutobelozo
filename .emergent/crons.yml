crons:
  - name: daily-summary
    description: "Envia o Resumo Diário da agenda por WhatsApp para cada profissional às 07h (Brasília)"
    cron: "0 7 * * *"
    timezone: "America/Sao_Paulo"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/daily-summary"
    method: POST
    enabled: true
